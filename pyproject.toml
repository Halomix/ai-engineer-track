[project]
name = "course"
version = "0.1.0"
description = "AI Engineer track — 26-week build log"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "openai>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

# --- Code style and safety settings -------------------------------------
# These are the rules your editor and CI will enforce. Having them from
# day one is one of the things that makes a repo look professional.

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration files are generated by Alembic, not hand-written — don't lint
# machine-generated code against hand-written style rules.
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
# E/W = style, F = real bugs, I = import order, UP = modern syntax,
# B = common gotchas, SIM = needless complexity
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
# Start lenient so you aren't fighting types on day one.
# We tighten this in Phase 1 once you're comfortable.
ignore_missing_imports = true

[tool.pytest.ini_options]
# No testpaths restriction — each phase folder (phase-1/week-1/tests, etc.)
# gets discovered automatically as the course adds them.
addopts = "-v"
